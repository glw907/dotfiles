# tests/.vale.ini — exercises every glw907 rule at suggestion level
StylesPath = ../.config/vale/styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = glw907

[*.{go,ts,py}]
BasedOnStyles = glw907

# The literary register opts out of the em-dash ban. This is the audience-conditional
# toggle: every other register keeps glw907.EmDash on.
[fixtures/EmDashAllowed.*]
BasedOnStyles = glw907
glw907.EmDash = NO
