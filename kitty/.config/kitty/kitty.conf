# kitty is not the daily terminal on Bluefin -- Ptyxis is. kitty is kept as
# the gate platform for the tui-visual-verify skill, which drives a real
# kitty window and photographs what it paints. These defaults exist so that
# harness has a known font, size, and ground to capture against.

# Force XWayland. The capture harness finds and grabs the window with
# xdotool and ImageMagick's `import`, both X11-only, and Bluefin's GNOME
# session is Wayland. Without this the window is invisible to both.
linux_display_server x11

# ── Font ─────────────────────────────────────────────────────────────────────
# Both faces ship in the Bluefin base image, so nothing is installed for
# them. Symbols Nerd Font Mono is the glyph font actually present; the
# patched "JetBrainsMonoNL Nerd Font" this once mapped to is not, and fell
# through silently to tofu.
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Nerd Font symbol fallback so glyphs render consistently
symbol_map U+E000-U+F8FF   Symbols Nerd Font Mono
symbol_map U+F0000-U+FFFFF Symbols Nerd Font Mono
symbol_map U+100000-U+10FFFF Symbols Nerd Font Mono

# ── Window ────────────────────────────────────────────────────────────────────
background_opacity   0.95
window_padding_width 8
remember_window_size no
initial_window_width  150c
initial_window_height 45c

# ── Tab bar ───────────────────────────────────────────────────────────────────
tab_bar_style    powerline
tab_bar_min_tabs 2

# ── Scrollback ────────────────────────────────────────────────────────────────
scrollback_lines 10000

# ── Shell integration ─────────────────────────────────────────────────────────
shell_integration enabled
tab_title_template "{tab.active_wd.replace('/var/home/glw907', '~').split('/')[-1] or '/'}"

# ── Behaviour ─────────────────────────────────────────────────────────────────
copy_on_select          yes
strip_trailing_spaces   smart

# Ctrl+click to open URLs (even when app captures mouse)
mouse_map ctrl+left release grabbed,ungrabbed mouse_handle_click link

# ── Colors — Nord ─────────────────────────────────────────────────────────────
# Polar Night / Snow Storm / Frost / Aurora palette
# https://www.nordtheme.com/docs/colors-and-palettes
background            #2e3440
foreground            #d8dee9
cursor                #88c0d0
selection_background  #4c566a

# Normal (Polar Night blacks + Aurora accents)
color0   #3b4252
color1   #bf616a
color2   #a3be8c
color3   #ebcb8b
color4   #81a1c1
color5   #b48ead
color6   #88c0d0
color7   #e5e9f0

# Bright
color8   #4c566a
color9   #bf616a
color10  #a3be8c
color11  #ebcb8b
color12  #81a1c1
color13  #b48ead
color14  #8fbcbb
color15  #eceff4
