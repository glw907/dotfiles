#
# aerc main configuration
# https://github.com/glw907/workstation
#
# Minimal config - only non-default values are set here.
# See aerc-config(5) for all options and defaults.

[general]

[ui]
# Message list columns (default layout, custom flags column)
index-columns=date<20,name<17,flags>4,subject<*
column-date= {{.DateAutoFormat .Date.Local}}
column-flags={{if .IsReplied}}{{end}}{{if .IsFlagged}}{{end}}{{if .HasAttachment}}📎{{end}}{{if .IsUnread}}{{end}}
column-name={{.Peer | names | join ", "}}

# Sidebar and dirlist
sidebar-width=23
dirlist-tree=true
dirlist-left= {{.Folder}}
dirlist-right= {{if .Unread}}{{humanReadable .Unread}} {{end}}

# Look and feel
styleset-name=nord-custom
border-char-vertical=│
fuzzy-complete=true
mouse-enabled=true

# Tab titles
tab-title-account=Mail
tab-title-composer={{.Subject}}

# Thread display (Nord-friendly minimal characters)
thread-prefix-tip = "›"
thread-prefix-indent = " "
thread-prefix-stem = "│"
thread-prefix-limb = "─"
thread-prefix-has-siblings = "├─"
thread-prefix-last-sibling = "└─"

[statusline]
column-left={{.StatusInfo}}

[viewer]
# Prefer plain text; fall back to HTML rendered via pandoc
alternatives=text/plain,text/html

# Custom header rendering via format-headers filter.
# header-layout is set to a nonexistent header (X-Collapse) so aerc
# hides its built-in header row, leaving only the filter output.
show-headers=true
header-layout=X-Collapse

[compose]
editor=nvim-mail
edit-headers=true
address-book-cmd=khard email --parsable --remove-first-line %s
empty-subject-warning=true
no-attachment-warning=^[^>]*attach

# Sends RFC 3676 format=flowed bodies. The receiving side (wrap -r in
# wrap-plain) reflows them to the viewer's terminal width.
format-flowed=true

[multipart-converters]
# Compose in markdown; aerc auto-generates an HTML alternative on send
text/html=pandoc -f markdown -t html --standalone

[filters]
# Plain text: reflow hard-wrapped paragraphs to terminal width, colorize
text/plain=wrap-plain
# HTML: convert to markdown for terminal display
text/html=pandoc -f html -t markdown | colorize
# Binary attachments: show type hint instead of garbage
application/zip=echo "ZIP archive - use :open or :save to download"
application/pdf=echo "PDF document - use :open or :save to download"
application/*=echo "Binary attachment - use :open or :save to download"
# Structured types
text/calendar=calendar
message/delivery-status=colorize
message/rfc822=colorize
# Custom header colorization and reordering (Nord palette)
.headers=format-headers

[openers]

[hooks]

[templates]
