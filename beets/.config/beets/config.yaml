# Music library mastering. ~/Music is the canonical library; replicas
# (Navidrome pod, R2 backup) are pushed by music-sync and never edited
# in place. Import workflow: download purchase, then `beet import <dir>`.

directory: ~/Music
# Mutable state lives outside ~/.config so stow never folds it into the
# dotfiles repo on a fresh machine.
library: ~/.local/share/beets/library.db

import:
  move: yes
  write: yes

paths:
  default: $albumartist/$album%aunique{}/$track $title
  singleton: Singles/$artist - $title
  comp: Compilations/$album%aunique{}/$track $title

plugins: fetchart embedart

fetchart:
  auto: yes

embedart:
  auto: yes
